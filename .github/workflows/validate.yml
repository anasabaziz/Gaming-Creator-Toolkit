name: Validate toolkit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s optional/dashboard -p test_dashboard.py -v
  media:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg melt
      - if: runner.os == 'macOS'
        run: brew install ffmpeg mlt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/doctor.py --require-video
      - run: python -m unittest discover -s skills/_video-shared -p "test_*.py" -v
      - run: python skills/_video-shared/test_article_frames.py
